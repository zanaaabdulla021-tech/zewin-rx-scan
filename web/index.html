<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rx Scan</title>
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/premium.css">
<link rel="stylesheet" href="css/account.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<script>
  tailwind.config = {
    corePlugins: { preflight: false },
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#16A34A', deep: '#15803D', tint: '#DCFCE7', line: '#BBF7D0' },
          ink: { DEFAULT: '#0F172A', soft: '#64748B' },
        },
        fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
      },
    },
  };
</script>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <img src="icon-512.png" alt="" style="width:56px;height:56px;border-radius:15px;display:block;margin:0 auto 14px;box-shadow:0 6px 16px rgba(1,144,105,0.25);">
    <h1 style="font-family:Georgia,serif;">Rx Scan</h1>
    <p class="sub">Log in with your email and password</p>
    <div class="field" style="margin-bottom:12px;">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" dir="ltr">
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" dir="ltr">
    </div>
    <button class="btn-primary" id="login-btn" style="width:100%;margin-top:18px;">Log in</button>
    <div id="login-error" style="display:none;" class="login-error"></div>
    <button type="button" id="show-register-btn" style="width:100%;margin-top:14px;background:none;border:none;color:var(--amber-deep);font-size:12.5px;text-decoration:underline;">Register your pharmacy</button>
  </div>

  <div class="login-card" id="register-card" style="display:none;margin-top:14px;">
    <h1 style="font-family:Georgia,serif;font-size:18px;">Register your pharmacy</h1>
    <p class="sub">Creates a new, fully separate account for your pharmacy</p>
    <div class="field" style="margin-bottom:12px;">
      <label for="reg-org-name">Pharmacy name</label>
      <input type="text" id="reg-org-name">
    </div>
    <div class="field" style="margin-bottom:12px;">
      <label for="reg-branch-name">First branch name (optional)</label>
      <input type="text" id="reg-branch-name" placeholder="Main Branch">
    </div>
    <div class="field" style="margin-bottom:12px;">
      <label for="reg-admin-email">Your email</label>
      <input type="email" id="reg-admin-email" dir="ltr">
    </div>
    <div class="field">
      <label for="reg-admin-password">Choose a password</label>
      <input type="password" id="reg-admin-password" dir="ltr">
    </div>
    <button class="btn-primary" id="register-btn" style="width:100%;margin-top:18px;">Create pharmacy account</button>
    <div id="register-error" style="display:none;" class="login-error"></div>
    <button type="button" id="show-login-btn" style="width:100%;margin-top:14px;background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;">Back to log in</button>
  </div>
</div>

<div id="app-screen" class="shell" style="display:none;" x-data="{ activeView: 'scan-view' }">
  <div class="sidebar">
  <header>
    <div class="brandrow">
      <div class="brand-left">
        <div class="brand-mark"><img src="icon-512.png" alt="" style="width:100%;height:100%;object-fit:cover;"></div>
        <div>
          <h1>Rx Scan</h1>
          <div class="branch-tag" id="branch-tag"></div>
          <select id="company-switcher" style="display:none;margin-top:6px;font-family:inherit;font-size:12.5px;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);"></select>
        </div>
      </div>
      <button class="icon-btn" id="notif-btn" style="position:relative;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span id="notif-badge" style="display:none;position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px;"></span>
      </button>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </header>
    <div class="tabs" id="tabs">
      <button class="tab-btn" :class="{ active: activeView === 'scan-view' }" @click="activeView = 'scan-view'" data-view="scan-view" id="scan-tab-btn">Scan</button>
      <button class="tab-btn" :class="{ active: activeView === 'history-view' }" @click="activeView = 'history-view'" data-view="history-view" id="history-tab-btn">History</button>
      <button class="tab-btn" :class="{ active: activeView === 'reports-view' }" @click="activeView = 'reports-view'" data-view="reports-view" id="reports-tab-btn" style="display:none;">Reports</button>
      <button class="tab-btn" :class="{ active: activeView === 'admin-view' }" @click="activeView = 'admin-view'" data-view="admin-view" id="admin-tab-btn" style="display:none;">Admin</button>
      <button class="tab-btn" :class="{ active: activeView === 'account-view' }" @click="activeView = 'account-view'" data-view="account-view">Account</button>
    </div>
  </div>

  <main id="app-main"></main>
</div>

<div id="superadmin-screen" class="shell" style="display:none;" x-data="{ activeView: 'sa-dashboard-view' }">
  <div class="sidebar">
  <header>
    <div class="brandrow">
      <div class="brand-left">
        <div class="brand-mark"><img src="icon-512.png" alt="" style="width:100%;height:100%;object-fit:cover;"></div>
        <div>
          <div class="brand-title">Rx Scan</div>
          <div class="branch-tag" id="sa-tag">Super Admin</div>
        </div>
      </div>
      <button id="sa-logout-btn" class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </header>
  <div class="tabs" id="sa-tabs">
    <button class="tab-btn" :class="{ active: activeView === 'sa-dashboard-view' }" @click="activeView = 'sa-dashboard-view'" data-saview="sa-dashboard-view">Dashboard</button>
    <button class="tab-btn" :class="{ active: activeView === 'sa-companies-view' }" @click="activeView = 'sa-companies-view'" data-saview="sa-companies-view">Pharmacies</button>
    <button class="tab-btn" :class="{ active: activeView === 'sa-payments-view' }" @click="activeView = 'sa-payments-view'" data-saview="sa-payments-view">Payments</button>
    <button class="tab-btn" :class="{ active: activeView === 'sa-activity-view' }" @click="activeView = 'sa-activity-view'" data-saview="sa-activity-view">Activity Log</button>
    <button class="tab-btn" :class="{ active: activeView === 'sa-admins-view' }" @click="activeView = 'sa-admins-view'" data-saview="sa-admins-view">Super Admins</button>
  </div>
  </div>

  <main id="sa-main"></main>
</div>

<div id="confirm-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:200;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--card);border-radius:18px;padding:24px 22px;max-width:360px;width:100%;box-shadow:0 24px 60px rgba(15,23,42,.25);">
    <div style="width:44px;height:44px;border-radius:12px;background:var(--danger-tint);display:flex;align-items:center;justify-content:center;margin-bottom:14px;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke="var(--danger-deep)" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
    </div>
    <p id="confirm-modal-title" style="margin:0 0 6px;font-size:16px;font-weight:800;color:var(--ink);">Are you sure?</p>
    <p id="confirm-modal-message" style="margin:0 0 20px;font-size:13.5px;color:var(--ink-soft);line-height:1.6;"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button type="button" class="btn-ghost" id="confirm-modal-cancel">Cancel</button>
      <button type="button" class="btn-primary" id="confirm-modal-ok" style="background:var(--danger);">Delete</button>
    </div>
  </div>
</div>

<div id="notif-panel" style="display:none;position:fixed;top:16px;left:16px;right:16px;max-width:340px;margin-left:auto;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);z-index:50;max-height:70vh;overflow-y:auto;">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);">
    <b style="font-size:13.5px;">Notifications</b>
    <button type="button" id="notif-mark-all-btn" style="background:none;border:none;color:var(--amber-deep);font-size:12px;">Mark all read</button>
  </div>
  <div id="notif-list" style="padding:6px 10px;"></div>
</div>

<div class="toast" id="toast">Saved</div>

<script src="js/app.js"></script>
</body>
</html>
