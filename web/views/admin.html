    <div id="admin-view" class="view" :class="{ active: activeView === 'admin-view' }">
      <div class="page-header">
        <h2>Admin</h2>
        <p>Manage branches, your team, and the activity log.</p>
      </div>
      <section>
        <p class="section-label">Branches</p>
        <div class="branch-grid" id="branch-list"></div>
        <div id="branch-control-panel" style="display:none;"></div>
        <div class="card">
          <div class="field">
            <label for="new-branch-name">New branch name</label>
            <input type="text" id="new-branch-name">
          </div>
          <button class="btn-primary" id="add-branch-btn" style="align-self:flex-start;">Add branch</button>
        </div>
      </section>
      <section>
        <p class="section-label">Users</p>
        <select id="user-branch-filter" style="font-family:inherit;font-size:13.5px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);">
          <option value="">Select a branch to view its team</option>
        </select>
        <div class="admin-list" id="user-list"></div>
        <div class="card">
          <div class="field">
            <label for="new-user-email">Email</label>
            <input type="email" id="new-user-email" dir="ltr">
          </div>
          <div class="field">
            <label for="new-user-password">Initial password</label>
            <input type="text" id="new-user-password" dir="ltr">
          </div>
          <div class="field">
            <label for="new-user-role">Role</label>
            <select id="new-user-role">
              <option value="employee">Employee</option>
              <option value="viewer">Viewer (read-only)</option>
              <option value="branch_manager">Branch manager</option>
              <option value="company_admin">Company admin</option>
              <option value="owner">Owner</option>
            </select>
          </div>
          <div class="field">
            <label for="new-user-branch">Branch</label>
            <select id="new-user-branch"></select>
          </div>
          <button class="btn-primary" id="add-user-btn" style="align-self:flex-start;">Add user</button>
        </div>
      </section>
      <section>
        <p class="section-label">Activity log</p>
        <div class="admin-list" id="activity-log-list"></div>
      </section>
    </div>
