    <div id="reports-view" class="view">
      <div class="page-header">
        <h2>Reports</h2>
        <p>How your pharmacy is performing, at a glance.</p>
      </div>
      <section>
        <div class="stat-grid" id="report-total"></div>
      </section>
      <section>
        <p class="section-label">By branch</p>
        <div class="admin-list" id="report-by-branch"></div>
      </section>
      <section>
        <p class="section-label">By employee</p>
        <div class="admin-list" id="report-by-employee"></div>
      </section>
      <section>
        <p class="section-label">By category</p>
        <svg id="chart-by-category" width="100%" height="1" style="display:block;margin-bottom:10px;"></svg>
        <div class="admin-list" id="report-by-category"></div>
      </section>
      <section>
        <p class="section-label">By source (government/private)</p>
        <div class="admin-list" id="report-by-source"></div>
      </section>
      <section>
        <p class="section-label">By year</p>
        <div class="admin-list" id="report-by-year"></div>
      </section>
      <section>
        <p class="section-label">By month</p>
        <svg id="chart-by-month" width="100%" height="1" style="display:block;margin-bottom:10px;"></svg>
        <div class="admin-list" id="report-by-month"></div>
      </section>
      <section>
        <p class="section-label">By day (last 30 days)</p>
        <div class="admin-list" id="report-by-day"></div>
      </section>
      <section>
        <p class="section-label">By doctor</p>
        <input type="text" id="doctor-search" placeholder="Search by doctor name..." style="font-family:inherit;font-size:13.5px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);margin-bottom:2px;">
        <div class="admin-list" id="report-by-doctor"></div>
      </section>
      <section>
        <p class="section-label">Most used items</p>
        <div class="admin-list" id="report-top-medicines"></div>
      </section>
      <section id="doctor-detail-section" style="display:none;">
        <p class="section-label" id="doctor-detail-title">Doctor details</p>
        <div class="admin-list" id="doctor-detail-list"></div>
      </section>
    </div>
