    <div id="account-view" class="view">
      <div class="page-header">
        <h2>Account</h2>
        <p>Your profile, subscription, and company settings.</p>
      </div>
      <section>
        <p class="section-label">Profile photo</p>
        <div style="display:flex;align-items:center;gap:14px;">
          <div id="avatar-preview" style="width:64px;height:64px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke="var(--ink-soft)" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          </div>
          <div>
            <button class="btn-ghost" type="button" id="avatar-pick-btn">Change photo</button>
            <input type="file" id="avatar-input" accept="image/*" style="display:none;">
          </div>
        </div>
      </section>
      <section>
        <p class="section-label">Account details</p>
        <div class="admin-list" id="account-info"></div>
      </section>
      <section id="company-logo-section" style="display:none;">
        <p class="section-label">Company logo</p>
        <div style="display:flex;align-items:center;gap:14px;">
          <div id="company-logo-preview" style="width:64px;height:64px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke="var(--ink-soft)" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </div>
          <div>
            <button class="btn-ghost" type="button" id="company-logo-pick-btn">Change logo</button>
            <input type="file" id="company-logo-input" accept="image/*" style="display:none;">
          </div>
        </div>
      </section>
      <section id="subscription-section" style="display:none;">
        <p class="section-label">Subscription</p>
        <div class="admin-list" id="subscription-info"></div>
      </section>
      <section id="payment-section" style="display:none;">
        <p class="section-label">Payment</p>
        <div class="card">
          <p class="meta" style="margin:0 0 4px;">No payment gateway is connected yet — request activation manually and the platform admin will verify and activate your account.</p>
          <div class="field">
            <label for="payment-reference">Payment reference / note (optional)</label>
            <input type="text" id="payment-reference" placeholder="e.g. Bank transfer, receipt #1234">
          </div>
          <button class="btn-primary" id="request-payment-btn" style="align-self:flex-start;">Request activation</button>
          <div id="payment-request-msg"></div>
        </div>
        <div class="admin-list" id="payment-history" style="margin-top:10px;"></div>
      </section>
      <section>
        <p class="section-label">Change password</p>
        <div class="card">
          <div class="field">
            <label for="cur-password">Current password</label>
            <input type="password" id="cur-password" dir="ltr">
          </div>
          <div class="field">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" dir="ltr">
          </div>
          <button class="btn-primary" id="change-pass-btn" style="align-self:flex-start;">Change</button>
          <div id="change-pass-msg"></div>
        </div>
      </section>
    </div>
